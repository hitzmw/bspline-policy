defaults:
  - _self_
  - task: franka_bowl_image_bspline

name: train_drifting_unet_franka_image_bspline
_target_: bspline_policy.workspace.train_drifting_bspline_image_workspace.TrainDriftingBSplineImageWorkspace

task_name: ${task.name}
shape_meta: ${task.shape_meta}
exp_name: "drifting_bspline"

horizon: 16
n_obs_steps: 2
n_action_steps: 8
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}
past_action_visible: false
obs_as_global_cond: true

policy:
  _target_: bspline_policy.policy.drifting_unet_franka_bspline_image_policy.DriftingUnetFrankaBSplineImagePolicy
  shape_meta: ${shape_meta}
  horizon: ${horizon}
  # The model returns all 16 B-spline parameter rows. 8 decoded physical
  # control actions (20Hz -> 0.4s) are executed per chunk at deployment.
  n_action_steps: ${horizon}
  execution_action_steps: ${n_action_steps}
  n_obs_steps: ${n_obs_steps}
  obs_as_global_cond: ${obs_as_global_cond}
  crop_shape: [112, 112]
  diffusion_step_embed_dim: 128
  down_dims: [512, 1024, 2048]
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: true
  obs_encoder_group_norm: true
  eval_fixed_crop: true
  temperatures: [0.02, 0.05, 0.2]
  per_timestep_loss: true
  gen_per_label: 8
  bspline_degree: ${task.dataset.bspline_degree}

ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

# Dual 128x128 cameras, crop 112: roughly a quarter of the Tool Hang pixel
# budget, so batch 64 stays within 24G with the 8-candidate generation.
dataloader:
  batch_size: 64
  num_workers: 8
  shuffle: true
  pin_memory: true
  persistent_workers: false

val_dataloader:
  batch_size: 64
  num_workers: 8
  shuffle: false
  pin_memory: true
  persistent_workers: false

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

training:
  device: "cuda:0"
  seed: 42
  debug: false
  resume: true
  lr_scheduler: constant_with_warmup
  lr_warmup_steps: 500
  num_epochs: 300
  gradient_accumulate_every: 1
  use_ema: true
  # No simulator for real-robot data: never roll out.
  rollout_every: 1000000
  checkpoint_every: 25
  val_every: 1
  sample_every: 5
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0

logging:
  project: bspline_policy_franka
  resume: true
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  tags: ["${name}", "${task_name}", "${exp_name}"]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: val_loss
    mode: min
    k: 5
    format_str: "epoch={epoch:04d}-val_loss={val_loss:.3f}.ckpt"
  save_last_ckpt: true
  save_last_snapshot: false

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}
