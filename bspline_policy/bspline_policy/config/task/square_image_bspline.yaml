name: square_image_bspline

shape_meta: &shape_meta
  obs:
    agentview_image:
      shape: [3, 84, 84]
      type: rgb
    robot0_eye_in_hand_image:
      shape: [3, 84, 84]
      type: rgb
    robot0_eef_pos:
      shape: [3]
      type: low_dim
    robot0_eef_quat:
      shape: [4]
      type: low_dim
    robot0_gripper_qpos:
      shape: [2]
      type: low_dim
  # The dataset adds one knot channel and emits [16, 8] parameters.
  action:
    shape: [7]

task_name: &task_name square
dataset_type: &dataset_type ph
dataset_path: &dataset_path ../diffusion_policy/data/robomimic/datasets/square/ph/image.hdf5
abs_action: &abs_action false

env_runner:
  _target_: bspline_policy.env_runner.robomimic_bspline_image_runner.RobomimicBSplineImageRunner
  dataset_path: *dataset_path
  shape_meta: *shape_meta
  n_train: 6
  n_train_vis: 2
  train_start_idx: 0
  n_test: 50
  n_test_vis: 4
  test_start_seed: 100000
  max_steps: 400
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  render_obs_key: agentview_image
  fps: 10
  crf: 22
  past_action: ${past_action_visible}
  abs_action: *abs_action
  tqdm_interval_sec: 1.0
  # Eight workers fit the 32 GB local host; all 56 initializations are still
  # evaluated in deterministic chunks.
  n_envs: 8

dataset:
  _target_: bspline_policy.dataset.robomimic_replay_bspline_image_dataset.RobomimicReplayBSplineImageDataset
  shape_meta: *shape_meta
  dataset_path: *dataset_path
  horizon: ${horizon}
  pad_before: 0
  pad_after: 0
  n_obs_steps: ${dataset_obs_steps}
  # A cubic chunk has chunk_size + 2 * degree = 10 + 6 = 16 rows.
  chunk_size: ${eval:'${horizon}-2*${task.dataset.bspline_degree}'}
  bspline_degree: 3
  max_error: 0.002
  stride: 1
  abs_action: *abs_action
  rotation_rep: rotation_6d
  relative_knots: false
  # Online Robomimic supplies [past, current] observations.
  observation_history: true
  use_cache: true
  cache_base_path: data/cache/robomimic/square_ph_image
  cache_suffix: square_ph_image_delta_action7_bspline_v1
  cache_decoded_replay: false
  cache_preprocessed_samples: false
  cache_preprocessed_device: cpu
  cache_preprocessed_share_memory: false
  cache_preprocessed_rgb_dtype: float32
  seed: 42
  val_ratio: 0.02
